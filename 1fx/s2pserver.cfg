// Voting cvars 

seta g_allowVote "1" // Controls whether voting is allowed at all in the server
seta g_failedVoteDelay "1" // Controls how many minutes has to pass up until a client can call a new vote after their previous one failed
seta g_voteDuration "60" // Controls how long an usual vote takes
seta vote_successThreshold "55" // Controls how many players need to vote yes for the vote to succeed

// Voting availability, based on admin levels.
// If an option is 0, then every client can call out this option 
// Otherwise, it follows the same logic as above admin commands.
// 1 => B-Admin, 2 => Admin, 3 => S-Admin, 4 => H-Admin, 5 => RCON

seta vote_map "3"
seta vote_kick "2"
seta vote_timelimit "2" // Settimelimit, extendtimelimit
seta vote_scorelimit "2"
seta vote_teams "3" // Shuffle, swap, clan vs all
seta vote_mute "2"
seta vote_poll "1"

// Gametype cvars

seta gt_simpleScoring "0" // Controls whether clients will also get score points for objectives. 1 => only team gets score, 0 => both team and client gets score

// Gametype specific team color prefixes

seta gt_blueTeamColored "^yB^Il^fu^+e^7 Team" // Sets the colored version of the blue team in various gametypes. Will also be used to get the colorless name
seta gt_redTeamColored "^$R^Te^Hd^7 Team" // Sets the colored version of the red team in various gametypes. Will also be used to get the colorless name

seta gt_hiderTeamColored"^1H^Ti^od^qe^+r^7s^7 Team" // Sets the colored version of the hiders team
