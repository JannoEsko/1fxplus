// This is the configuration file for SoF2Plus - 1fxplus edition
// Please put this file in either base or your fs_game folder.
// Please do not rename this file, engine searches exactly for this name so it would be automatically executed
// You do not need to take the s2pserver.cfg file from SoF2Plus repository - 1fxplus version is enough.
// Please refer to the GitHub page for extra information: https://github.com/JannoEsko/sof2plus-engine.git
// For 1fxplus - https://github.com/JannoEsko/1fxplus.git 
// All bug reports can be raised in one or the other repository as an issue.

// Networking cvars

seta net_ip "0.0.0.0" // Sets the IP address from which the server sockets listen. Can be left as 0.0.0.0, which defaults to all available interfaces.

// If you run only a single-protocol game, you still need to specify the respective game port
seta gold_net_port "20100" // Sets the port to which Gold (1.03; prot 2004) players connect to. 
seta silver_net_port "20101" // Sets the port to which Silver (1.00 prot 2002) players connect to

// Multiprotocol and modules

seta net_multiprotocol "1" // If set to 1, then the game will be broadcasted to both Silver (1.00) and Gold (1.03). Ensure that you do not enable weapons which do not exist in one or the other game. If you run 1fxplus, that'll take care of it by itself
seta net_runninglegacy "0" // This one has to be 0 on 1fxplus. Sets the baseline game module version. 0 => Game module is running Gold (1.03); 1 => Game module is running Silver (1.00). Mandatory to set correctly even if not running multiprotocol
seta sv_gameModernABI "1" // This one has to be 1 on 1fxplus. Controls which ABI is used for the game module. 0 => Legacy, original SoF2 ABI, 1 => Modern ABI (sof2plus-game / 1fxplus). If your server is not starting and errors out due to invalid game system traps, then most likely this cvar is set incorrectly.
set vm_game "0" // This has to be 0 on 1fxplus. Controls how the Virtual Machines are handled. 0 => Native VM, in other words, a shared library (DLL / SO). If your game module runs DLL/SO's, then set this to 0. If you run QVM, please set this to 2. 2 will try to compile the QVM for faster usage and if your architecture does not support running in VM Compiled mode, it'll drop to 1 automatically.
set vm_gametype "0" // This has to be 0 on 1fxplus. Controls how the Virtual Machine for Gametype module is handled, see above.

// Client mod & compatibility

seta sv_silverClientMod "RPM" // Sets the fs_game sent over to silver clients over configstrings, directs what mod should the client load. 
seta sv_goldClientMod "1fx.rocmod" // You can set this to rocmod or 1fx.rocmod. Both have out of box support. 1fx.rocmod is preferred as that brings game compatibility for custom gametypes. Sets the fs_game sent over to gold clients over configstrings, directs what mod should the client load.

// Both of below cvars can be kept at 0. Using them requires 1fx.rocmod to be sv_goldClientMod.
// When running a custom gametype (e.g. H&S), these will be forced to 1.
seta sv_useLegacyNades "0" // If the client is using 1fx.rocmod client mod on Gold, then this can be set to 1. Otherwise this has to be 0.
seta g_enforce1fxAdditions "0" // Controls whether we should enforce 1fx. Additions in the server. This only affects gold clients and for custom gametypes, it is a must (and will be triggered by the mod if needed)

// General server info

seta sv_hostname "1fxplus" // Sets the hostname of the server
seta rconpassword "1fxplus" // Sets the rconpassword of the server
seta g_password "" // Sets a password to the server
seta g_motd "" // Message of the day, usually used to indicate next map

// Client / Connection limits

seta sv_maxClients "16" // Sets how many clients can connect to the server
seta g_maxGameClients "0" // How many simultaneous clients can be in the game (e.g. You allow 24 players in the teams but sv_maxclients is 64, 24 players can play, others can be in spec)
seta sv_maxIPConnections "10" // Sets how many clients can connect from a single IP address (q3fill fix)
seta sv_reconnectlimit "3" // How fast (in seconds) can a client reconnect after multiple attempts.
seta sv_floodProtect "1" // Keep at 1. Limits reliableCommands being parsed by the engine/game (e.g. chat etc)
seta sv_minPing "0" // Min ping the player can have while connecting.
seta sv_maxPing "0" // Max ping the player can have while connecting.
seta sv_minRate "15000" // Sets the min rate value accepted from a client. Preferred value: 15000 and upwards.
seta sv_maxRate "0" // Sets the max rate value accepted from a client. It's fine to keep this at 0

// Downloads & Pure

set sv_pure "0" // If you intend to use smartDownloads, do not turn this on. If you intend to run multiprotocol, do not turn this on. This directs the players to have the same checksum hashes on the packages loaded by the server and client
seta sv_allowDownload "1" // Can be kept at 1 as q3dirtrav does not work with SoF2Plus. Allows clients to download files directly from the server. Requires clients to also run cl_allowdownload 1
seta sv_dlRate "0" // Controls how fast the autodownload is on the server (msec). 0 is unlimited.
seta sv_smartDownload "1" // References only current played map in referenced paks list. Breaks sv_pure compatibility.
seta sv_smartAdditionalPaksGold "ROCmod_1fx_coreUI_1.21" // PK3's to append to the referenced paks list for gold clients to download on top of the current map. Requires sv_smartDownload. List has to be a space-delimited pk3 filenames without extension, e.g. sv_smartAdditionalPaksGold "ROCmod_1fx_coreUI_1.21"
seta sv_smartAdditionalPaksSilver "" // PK3's to append to the referenced paks list for gold clients to download on top of the current map. Requires sv_smartDownload. List has to be a space-delimited pk3 filenames without extension, e.g. sv_smartAdditionalPaksSilver "RPM_2_0"


// Engine performance

set sv_fps "20" // Sets how often engine frames are run. In modern games this is called a 'tickrate'. Directly tied to the client /snaps value. Higher values yield more correct mechanics, but suffer on resources.
seta com_gracefulErrors "1" // On a ERR_DROP error, engine tries to skip to the next map instead of crashing. Works best if sv_mapcycle is defined, because it runs the mapcycle command.
seta com_ansiColor "1" // When toggled on, instead of seeing e.g. ^71fx^1. in the console, you'll see the colored version.
seta com_zoneMegs "48" // Defines the memory given for the zone memory allocations. There's no point to change this unless you end up with allocation error messages.
seta com_hunkMegs "128" // Defines the memory given for the hunk allocations. There's no point to change this unless you end up with allocation error messages.

// Physics & Movement

seta g_speed "280" // Speed of the clients
seta g_gravity "800" // Gravity of the clients
seta g_knockback "700" // How much knockback is applied to the player on e.g. Getting hit 
seta g_leanType "0" // Sets the leantype used in client movement predictions on server side. Ideally this should be synchronized with the client. 0 => Gold lean type is relayed to all clients, 1 => Silver lean type is relayed to the clients, 2 => Gold lean type is relayed to Gold clients, Silver lean type relayed to Silver clients
seta g_waterSpeedDecrement "110" // How much water reduces your speed
seta g_waterSpeedTime "200" // How long water speed decrement is applied to you (after exiting the water)
seta g_ladderType "0" // If this is turned off, then ladders behave like they do in gold, if this is turned on, then ladders behave like they do on Silver. E.g. You can use jump button to move up a ladder

// Gameplay basics

seta g_friendlyFire "0" // Turns friendlyfire on/off
seta g_refreshCooldown "5" // How long you have to wait before you can run /refresh again
seta g_smoothClients "1" // Extrapolates client movement. Keep to 1
seta g_noHighFps "1" // Controls whether we allow high FPS exploits (mainly 333 FPS). Recommended to keep at 1
seta g_allowThirdPerson "1" // Controls whether thirdperson is allowed on the server
seta timelimit "0" // Sets the timelimit for the map
seta scorelimit "0" // Sets the scorelimit for the map
seta dmflags "8" // Bitflags to control game logic. Flags sum together. Possible flags: 0 => none, 8 => no falldamage, 16 => fixed FOV, 32 => no footsteps. So if you want e.g. No falldamage and no footsteps, you do 8 + 32 = 40.
seta g_gametype "hns" // Sets the gametype. Default setting, can be also overridden by the game module

// Below cvars are actually overridden by the game module, therefore you do not need to set them.
//seta g_spoofGametype "0" // Whether the server should spoof the gametype. Useful if you want to load a custom gametype without using latched g_gametype variables to spoof it. If turned on, requires usage of g_publicGametype
//seta g_publicGametype "inf" // If g_spoofGametype is toggled on, this is the gametype sent over to the clients. 

// Weapon behaviour

seta g_recoilRatio "1" // Controls the recoil ratio without (re)parsing the weapon files. If this is set to 0, no recoil is applied to the weapons
seta g_inaccuracyRatio "1" // Controls the inaccuracy ratio without (re)parsing the weapon files. If this is set to 0, no inaccuracy is applied to the weapons.

// RoxAC / Anticheat

seta ac_allowcross "1" // RoxAC specific - allow usage of thirdperson crosshair
seta ac_norecoil "0" // RoxAC specific - trigger norecoil in server

// Weapon information

seta g_inviewFile "ext_data/SOF2.inview" // Sets the location from where to load the weapon inview file.
seta g_weaponFile "ext_data/SOF2.wpn" // Sets the location from where to load weapon data (damages, timings etc)

seta g_available "200020000020000002000000" // Sets available weapons. Weapon ints:
                    // 1 => Knife
                    // 2 => M1911A1 Pistol
                    // 3 => US Socom Pistol 
                    // 4 => Silver Talon (keep disabled on multiprotocol; 1fxplus will also disable this).
                    // 5 => M590 Shotgun
                    // 6 => Micro Uzi Submachinegun
                    // 7 => M3A1 Submachinegun
                    // 8 => MP5 (keep disabled on multiprotocol; 1fxplus will also disable this)
                    // 9 => USAS-12 shotgun
                    // 10 => M4 Rifle
                    // 11 => AK74 Rifle 
                    // 12 => SIG551 (keep disabled on multiprotocol; 1fxplus will also disable this)
                    // 13 => MSG90A1 Sniper
                    // 14 => M60 Machinegun
                    // 15 => MM1 Grenade Launcher
                    // 16 => RPG7 Launcher 
                    // 17 => M84 Flash Grenade
                    // 18 => SMOHG92 Frag Grenade
                    // 19 => ANM14 Fire Grenade 
                    // 20 => M15 Smoke Grenade
                    // Next weapons are all Client Additions weapons and only usable if sv_useLegacyNades is 1, g_enforce1fxAdditions is 1 and sv_goldClientMod is 1fx.rocmod
                    // 21 => M67 Frag Grenade (client additions only)
                    // 22 => F1 Frag Grenade (client additions only)
                    // 23 => L2A2 Frag Grenade (client additions only)
                    // 24 => MDN11 Frag Grenade (client additions only)

seta g_pickupsDisabled "0" // Whether the game has pickups for weapons or not
seta g_weaponrespawn "15" // How often weapons respawn in a pickup-game
seta g_backpackrespawn "40" // How often backpacks respawn in the game

// Spectator & Inactivity

seta g_followEnemy "1" // Allow following enemy players while waiting to spawn
seta g_forceFollow "0" // Force follow a player (disables free-float spec)
seta g_timeouttospec "15" // Controls how fast a player is forced to spectators team due to not receiving any commands from them (connection loss)
seta g_inactivity "180" // How long it takes for the client to time out into spectators team due to not moving / playing.

// Respawn & Round behaviour

seta g_respawnInvulnerability "3" // How long the players are invulnerable in base
seta g_respawnInterval "3" // Controls how often players respawn
seta g_forcerespawn "20" // How fast a client will be forced to respawn even if they don't press a button to trigger it
seta g_roundstartdelay "5" // How long players are frozen before a round starts; Overriden by the H&S counterpart cvar in h&s gametype
seta g_roundtimelimit "5" // Round time limit
seta g_doWarmup "0" // Whether warmup should be used
seta g_warmup "20" // How long a warmup lasts in the server
seta g_suddenDeath "1" // Whether to wait for the scores to become untied for the match to end
seta g_roundjointime "5" // How long after a round start can the players connect and be spawned into the game

// Team handling

seta g_autoEvenTeams "1" // Whether teams will be automatically balanced in an interval
seta g_teamForceBalance "0" // Force-balance the teams
seta g_teamAutoJoin "0" // Controls whether clients should be automatically pushed into a team after joining

// Penalties

seta g_suicidePenalty "-1" // What score penalty the player gets for suicide
seta g_teamkillDamageForgive "50" // How much the player is forgiven for team damage
seta g_teamkillDamageMax "300" // How much damage the player can deal against a teammate before being punished.
seta g_teamkillPenalty "-1" // What score penalty the player gets for teamkilling
seta g_teamkillNoExcuseTime "8" // Controls how long after a round start teamkilling is not excuseable
seta g_teamkillNoExcuseMultiplier "3" // How much damage is multiplied for the not excuseable-timeframe damage

seta g_voiceFloodPenalty "60" // How long a player cannot use voice chat in seconds after exceeding floodcount
seta g_voiceFloodCount "6" // How many voice commands can a player send within a minute

// Nosections
// 1fxplus, as was in 1fxmod, allows the use of no sections, and the automatic spawn/despawning of them.
// There are 4 nosections introduced - lower, roof, middle, whole.
// Naming might sound a bit odd, but it's coming from mp_italy context, except for nolower, which existed before that.
// This does require entities to set the values.
// Please see 1fx/ents/ctf/mp_italy.ent or 1fx/ents/ctf/mp_kam2.ent as a reference.
// Automatic nosections are usually applied based on player counts.
// On a round-based gametypes, the sections are applied once per round start
// For respawn-based gametypes, there's a timer applied, either based on "wait" param on entity or within 10 seconds.
seta g_useAutoSections "1" // Whether the nosection entities should be automatically applied

seta g_useNoLower "1"
seta g_useNoRoof "1"
seta g_useNoMiddle "1"
seta g_useNoWhole "1"

// Competition mode
// It is very similar to 1fx system, apart from bestOf logic which you can read below.
// Competition mode match variables define the "default" values.

seta match_bestOf "1" // Controls whether the competition mode should use 'best-of' logic. In other words, in a swap-teams based gametype, if after a swap the game is deemed unwinnable for the losing team, the match is stopped prematurely due to score (e.g. If you have a scorelimit of 3 and swaps enabled, first round red team gets 3 flags, blue team gets 1 flag, then that means that after the swap, if the new blue team (old red team) gets 2 more flags, new red team (old blue team) cannot win the match in any way possible and the match will end)
seta match_scorelimit "3" // Default scorelimit for a match
seta match_timelimit "30" // Default timelimit for a match
seta match_lockspecs "1" // Whether spectator team should be locked in a match
seta match_doublerounds "1" // Whether we run double rounds in a match (along with a swap)
seta match_followEnemy "0" // Whether we should allow spectating enemies in a match

seta g_mvchatCheckSoundFiles "0" // Controls whether MVChat parsing system should check the sound file existence included in a MVChat file

seta g_serverColors "Cbk+7" // Sets the colors which are colorized by the server automatically, e.g. Admin commands and similar

seta g_subnetOctets "3" // How many octets we use for a subnetban

// Logging activities 
// 1fxplus provides multiple logging possibilities.
// You can log straight into SQLite databases, allowing a clear, structured lookup capabilities
// You can also use socket based logging, whereas structured messages are sent as UDP packets to the specified IP:Port

// Socket logging 
// This opens a bi-directional connection with the socket server. 
// If you're capable of modifying the source code, you can also set it up to do whatever's needed. 
// For logging, currently working defines are as follows:
// RCON log: structure is logRcon\g_sockIdentifier\ip\action
// Admin log: structure is logAdmin\g_sockIdentifier\performer\performer IP\receiver\receiver IP\action\reason\adminlevel\adminname\admintype
// Adminlevel is the integer level of the admin (1 = badmin, ...), adminname is the name they had when they got admin (to remove the possibility to "abuse" while using someone else's name). Admin type is an enum value:
// 1 => IP+Name based admin
// 2 => Name + Password based admin
// 3 => One-Time-Password based admin (requires support from the sockets to enable OTP admin access)
// 4 => GUID-based admin (not used in public builds as it is based on a shared OTP secret with Rox Anticheat; If you want, you can set it up with support of 1fx. # Shoke) - allows getting admin powers with you Rox Anticheat GUID (1.00 only)
// 5 => RCON admin (action was done with RCON powers).
// Login log (admin login): structure is logLogin\g_sockIdentifier\client name\client IP\adminlevel
// Game log: structure is logGame\g_sockIdentifier\performer\performer IP\receiver\receiver IP\text\action
// In 1fxplus repository, in examples folder, you can find a node.js example of the socket server.

seta g_logThroughSocket "0" // If this is turned on, log messages are sent in a structured way through the socket
seta g_sockIp "127.0.0.1" // Only relevant if g_logThroughSocket is set to 1. Defines the IP address of the socket server
seta g_sockPort "10000" // Defines the port of the socket server
seta g_sockIdentifier "" // This is the identifier in every sock logging message. If you run multiple servers, this can help a lot.

seta logfile "" // Set this to "" or 0 to disable logging into file from the engine side (will not prevent logging from Game VM side)
seta g_logToFile "0" // Whether we should log into a file. This will not affect logfile above, only game level logging
seta g_log "games.log" // Controls whether the game module should write logs. Set to "" or to 0 to turn off. Otherwise set to a filename which is written to the game folder. If you're using g_logToDatabase or g_logThroughSocket, then it's good to keep this off, as it is not needed.
seta g_logHits "0" // Whether hits are printed and logged, see also g_log
seta g_logSync "0" // Whether the files are written synchronously, in other words, whether file contents are flushed into the file immediately after write or whether we should let the OS decide

// Databases
// 1fxplus uses SQLite databases to handle persistent information.
// That includes admins, bans, statistics, aliases, countries, even in-game sessions

seta g_logToDatabase "1" // Whether we should log into a SQLite database
seta g_dbLogRetention "120" // How long we keep logs in a SQLite database

seta g_maxAliases "10" // How many aliases we keep in the database for a single IP

// Country lookups
// For country management, you have 2 options:
// 1) Register for a free API key in iphub - https://iphub.info
// IPHub's free API allows more than enough lookups per minute that you'll never reach the limit
// And, 1fxplus caches the results (see g_countryAging cvar)
// 2) Create your own SQLite table
// If you want to create your own SQLite table, then to make it compatible with 1fxplus, the structure must be the same.
// CREATE TABLE IF NOT EXISTS ip2country (ip VARCHAR(50), countrycode VARCHAR(10), country VARCHAR(50), blocklevel INTEGER, added TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
// Whilst rest is self explanatory, blocklevel is a field coming from IPHub. That defines whether a client is most likely using a VPN.
// Blocklevel values: 0 => safe, 1 => Confirmed VPN (very minor false-positives), 2 => Unsure (not blocked by the mod)
// Then you will have to add the contents yourself. IP is the full IP of the client, not an integer version or similar.
// Overall, we'd suggest to use the API version, that way you don't have to load a massive SQLite database whenever checking countries, because nevertheless SoF2 has a limited number of players, so it simply makes sense.

seta g_useCountryDb "1" // Whether to use Country DB. You're theoretically allowed to populate the table yourself without IPHub. IPHub's upside comes that with the usage of g_countryAging, you will always have an up-to-date IP2Country table. See above for table structure

seta g_useCountryAPI "1" // Whether to use IPHub API
seta g_iphubAPIKey "" // Highly recommended - use https://iphub.info to register for an API key. Iphub is used to perform IP2Country activities
seta g_vpnAutoKick "1" // Whether we kick VPN users automatically. Requires IPHub API and Country DB usage to perform correctly. If country DB is done manually, then setting 'blocklevel' to 1 is the same as stating that the client is running a VPN.

seta g_countryAging "120" // How long we deem an IP2Country row to be valid. If you're manually updating the country DB, turn this off. Otherwise it's good to keep on, as it'll clean out rows after X amount of days (120 in example) has passed.

// Messaging

// MOTD - Message of the Day
// This is a message displayed to the clients on first connect.
// Can be also displayed again by using /motd command in the console

seta g_motd1 "" // MOTD displayed to the clients on first connect. First line
seta g_motd2 "" // MOTD displayed to the clients on first connect. Second line
seta g_motd3 "" // MOTD displayed to the clients on first connect. Third line
seta g_motd4 "" // MOTD displayed to the clients on first connect. Fourth line
seta g_motd5 "" // MOTD displayed to the clients on first connect. Fifth line

// Automated messaging
// 1fxplus is capable of sending automatic messages to the chat of the server
seta g_automatedMessages "3" // This controls the automated messages in the server. 0 => system turned off, 1 => send info messages (g_automsg1 ... 5), 2 => send tips (/adm listtips; /rcon addtip), 3 => both info messages and tips are being sent
seta g_automsgPeriodicity "3" // How often we send an automated message (minutes)
seta g_autotipsPeriodicity "5" // How often we send an automated tip (minutes)

seta g_automsg1 "" // Automatic messages, if nothing is set, nothing is also sent.
seta g_automsg2 ""
seta g_automsg3 ""
seta g_automsg4 ""
seta g_automsg5 ""
seta g_automsg6 ""

// Anticamp system
// There are 2 anticamp systems in 1fxplus - one is radius based (the usual legacy version)
// Other is an extents based.
// Please refer to this commit for more info on extents based version: https://github.com/JannoEsko/1fxplus/commit/2b306d6780741cd03935c62597be84f132a36bc3

seta g_anticamp "0" // Toggles anticamp system
seta g_anticampType "1" // Setting this to 1 enables hybrid anticamp system, where both extents (in the entity directly) and radius checks are done (extents takes precedence). If this is 0, then if even 1 extent-entity is found, extents version will be used, otherwise only radius checks. Keeping this at 1 is OK
seta g_anticampRadius "300" // In which radius are we performing a check
seta g_anticampTime "30" // How long can I stay within a specific radius

// Admin cvars 

seta g_badminPrefix "^CB^b-^kA^+d^7min" // Sets the B-Admin prefix, shown in chat messages and various activities
seta g_adminPrefix "^CA^bd^km^+i^7n" // Sets the Admin prefix, shown in chat messages and various activities
seta g_sadminPrefix "^CS^b-^kA^+d^7min" // Sets the S-Admin prefix, shown in chat messages and various activities
