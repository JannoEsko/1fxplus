seta gt_bombDefuseTime"3" // How long it takes to defuse the bomb in DEM gametype
seta gt_bombPlantTime"3" // How long it takes to plant the bomb in DEM gametype

// Hide&Seek specific cvars
seta hideSeek_Extra "110110" // Which extras are enabled in H&S gametype. Values point to:
                    // 1 => MDN11 (Seeker box nade)
                    // 2 => F1 (Seeker teleport nade)
                    // 3 => L2A2 (Seeker uppercut nade)
                    // 4 => Goggles (Seeker invisibility nade)
                    // 5 => Briefcase (Fast knife attack for the best seeker from previous round)
                    // 6 => Random grenade (A nade which turns a hider into an object)
                    
seta hideSeek_Nades "1111" // Nades enabled in H&S gametype. Values point to:
                    // 1 => Frag grenade (pushes enemy away)
                    // 2 => Flash grenade 
                    // 3 => Smoke grenade 
                    // 4 => Fire grenade (slows enemy down)
                    
seta hideSeek_Weapons "11111" // Weapons enabled in H&S gametype. Values point to:
                    // 1 => RPG (Weapon for the hiders team, boosts the client when shot under yourself, makes running faster, given to the longest surviving hider from previous round)
                    // 2 => M4 (Weapon for the hiders team, regular attack stuns seekers if you hit them, alt attack produces cage for e.g. boosting or caging seekers, given to the second longest surviving hider from previous round)
                    // 3 => MM1 (Weapon for the seekers team, lowers gravity, shoots firenades, given to the first attacker)
                    // 4 => Telegun (Weapon for the hiders team, given at random and occasionally not at all; teleports you on a successful shot to the hider you shot at)
                    // 5 => Taser (Weapon for the seekers team, tases the hider for a limited period)
                    
seta hideSeek_randomFireNade "1" // Whether firenades are handed out randomly to the clients instead of allowing it to be picked from outfitting
seta hideSeek_roundstartdelay "30" // How long until seekers are released

seta g_boxAttempts "3" // How many box (MDN11) nade attempts are allowed before we do not give a nade back
seta g_cageAttempts "3" // How many cage (M4) attempts are allowed before we don't give cage ammo back
seta g_rpgBoost "450" // How high RPG boosts
seta g_mm1Style "0" // How MM1 interacts. 0 => MM1 shoots a firenade, 1 => MM1 boosts you like a RPG
seta g_rpgRemove "0" // Whether RPG should be removed from a client if there is no ammo and they've run out of speedboost. Expects g_rpgSpeedDrain to be turned on
seta g_hsgiveknife "1" // Whether hiders can give a knife to other hiders
seta g_rpgSpeedDrain "1" // Controls whether RPG speed gets drained
seta g_rpgSpeedDrainSec "0.25" // Controls in how many seconds should RPG speed drain be applied (0.25 => 4 times per second)

seta g_stunSpeedDecrement "110" // How much stun reduces your speed
seta g_stunSpeedIncrement "70" // How much stunning a seeker increases your speed
seta g_fireSpeedDecrement "110" // How much being in a fire radius reduces your speed
seta g_rpgSpeedIncrement "70" // How much RPG increases your speed
seta g_stunSpeedTime "4000" // How long stun speed alteration is applied to you
seta g_fireSpeedTime "1500" // How long fire speed alteration is applied to you

seta g_BurnEffect "1" // Makes the seeker burn after they get a kill
seta g_EnableKnifeBox "1" // When turned on, then every 5 stuns a hider gets, they get a knifebox - a knife they can throw which will spawn a box

seta g_hnsStatAging "15" // In how many days we remove H&S scores

